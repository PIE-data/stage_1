name: CI

on:
  pull_request:
  push:
    branches: [main]

# The conformance matrix cannot pass until all three implementations exist and
# the golden fixture is frozen. Rather than failing 27 checks from day one --
# which would block every PR -- each job switches itself on as soon as the code
# it tests appears in the repository.

jobs:
  detect:
    name: what exists
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.check.outputs.python }}
      node: ${{ steps.check.outputs.node }}
      go: ${{ steps.check.outputs.go }}
      golden: ${{ steps.check.outputs.golden }}
      conformance: ${{ steps.check.outputs.conformance }}
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          has() { [ -n "$(find "$1" -name "$2" -not -name '.gitkeep' 2>/dev/null | head -1)" ] && echo true || echo false; }

          {
            echo "python=$(has src/python 'test_*.py')"
            echo "node=$(has src/node 'package.json')"
            echo "go=$(has src/go 'go.mod')"
            echo "golden=$([ -s spec/golden/expected.sha256 ] && echo true || echo false)"
            echo "conformance=$([ -f tools/run_conformance.sh ] && echo true || echo false)"
            # A language enters the conformance matrix when its porter adds
            # src/<lang>/CONFORMANCE_READY -- a deliberate "my CLI implements
            # download, index and export-canonical", not a guess from the files.
            ready=$(for l in python node go; do if [ -f "src/$l/CONFORMANCE_READY" ]; then printf '"%s",' "$l"; fi; done)
            echo "ready=[${ready%,}]"
          } >> "$GITHUB_OUTPUT"

      - name: summary
        run: |
          echo "### What CI will run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| target | present |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| python tests | ${{ steps.check.outputs.python }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| node tests | ${{ steps.check.outputs.node }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| go tests | ${{ steps.check.outputs.go }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| conformance matrix | ${{ steps.check.outputs.conformance }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| languages in the matrix | ${{ steps.check.outputs.ready }} |" >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------- shared assets

  spec-assets:
    name: spec assets are well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: stop-word list
        run: |
          f=spec/stopwords_en.txt
          [ -f "$f" ] || { echo "missing $f"; exit 1; }
          terms=$(grep -vc '^#\|^$' "$f" || true)
          echo "$terms terms"
          [ "$terms" -gt 0 ] || { echo "stop-word list is empty"; exit 1; }

          # SPEC.md §3.3: one lowercase term per line.
          if grep -vE '^#|^$' "$f" | grep -qE '[A-Z]| '; then
            echo "stop-word list contains uppercase or spaces"; exit 1
          fi
          # Duplicates would silently do nothing, but signal a sloppy edit.
          dups=$(grep -vE '^#|^$' "$f" | sort | uniq -d)
          [ -z "$dups" ] || { echo "duplicate terms: $dups"; exit 1; }

      - name: line endings are LF
        run: |
          # Assets we author must be LF: CRLF would change their bytes and
          # break the canonical hash between a Windows and a Linux checkout.
          # The vendored golden books are excluded on purpose -- Gutenberg
          # serves CRLF, .gitattributes marks spec/golden/** as -text, and
          # they must stay byte-identical to the source.
          files=$(git ls-files spec/ | grep -v '^spec/golden/.*\.txt$')
          if [ -n "$files" ] && printf '%s\n' $files | xargs -r file | grep -q CRLF; then
            echo "CRLF found in an authored spec asset -- check .gitattributes"
            printf '%s\n' $files | xargs -r file | grep CRLF
            exit 1
          fi

  # ------------------------------------------------------------ unit tests

  python:
    name: python unit tests
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest ruff requests
      - name: lint
        run: ruff check src/python || true     # advisory until the style is settled
      - name: tests
        run: python -m pytest src/python -v

  node:
    name: node unit tests
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix src/node || npm install --prefix src/node
      - run: npm test --prefix src/node

  go:
    name: go unit tests
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
        working-directory: src/go
      - run: go test ./... -v
        working-directory: src/go

  # --------------------------------------------------------- conformance gate

  conformance:
    name: conformance (${{ matrix.language }}, ${{ matrix.backend }}, ${{ matrix.layout }})
    needs: detect
    # Only languages that declared themselves ready (src/<lang>/CONFORMANCE_READY):
    # a port still in progress shows no cell instead of nine red ones.
    if: needs.detect.outputs.conformance == 'true' && needs.detect.outputs.ready != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.ready) }}
        backend: [json, folder, sqlite]
        layout: [time, book, hash]
    steps:
      - uses: actions/checkout@v4

      # The mirror server and the Python CLI both need Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: matrix.language == 'node'
        run: npm ci --prefix src/node || npm install --prefix src/node

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: canonical hash == spec/golden/expected.sha256
        run: bash tools/run_conformance.sh ${{ matrix.language }} ${{ matrix.backend }} ${{ matrix.layout }}
